[build-system]
requires = ["setuptools >= 61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polysolve"
authors = [{name = "Lizzie", email = "lizzie.salmon@stfc.ac.uk"}]
requires-python = ">= 3.8"
readme = "README.md"
description = ""
license = {text = "BSD-3-Clause"}

#keywords = [...]
dependencies = ["numpy"]
#classifiers = [...]
dynamic = ["version"]

[project.urls]
Homepage="https://github.com/lizsalmon/polysolve"
Repository="https://github.com/lizsalmon/polysolve.git"

[tool.setuptools.dynamic]
version = {attr = "polysolve.__version__"}
